[package]
name = "cockroach-rollout-agent"
version = "0.1.1"
edition = "2024"
authors = ["jdfalk <jdfalk@users.noreply.github.com>"]
license = "MIT"
description = "Public-safe CockroachDB binary rollout helper and daemon scaffold"
homepage = "https://github.com/jdfalk/cockroach-rollout-agent"
repository = "https://github.com/jdfalk/cockroach-rollout-agent"
readme = "README.md"
keywords = ["cockroachdb", "rollout", "upgrade", "systemd"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[[bin]]
name = "cockroach-rollout-agent"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "tokio"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
hostname = "0.4"
native-tls = "0.2"
postgres = "0.19"
postgres-native-tls = "0.5"
rand = "0.10"
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic"] }

[dev-dependencies]
rcgen = "0.14"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
